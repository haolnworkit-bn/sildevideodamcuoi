name: Asset quality gates

on:
  pull_request:
  push:
    branches: [main, sprint-0-reliability]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lunar calendar regression tests
        run: npm run test:lunar
      - name: Production build
        run: npm run build
      - name: Asset quality gate
        run: npm run check:assets
      - name: Asset unit tests
        run: npm run test:assets
